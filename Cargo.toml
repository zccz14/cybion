[package]
name = "mobius"
version = "0.1.3"
edition = "2024"
license = "MIT"
description = "An unrestricted, multi-machine AI harness."

[[bin]]
name = "mobius"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
base64 = "0.22.1"
chrono = { version = "0.4.41", features = ["serde"] }
directories = "6.0.0"
flate2 = "1.1.2"
hostname = "0.4.1"
jsonwebtoken = { version = "9.3.1", features = ["use_pem"] }
notify = "8.0.0"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "multipart", "rustls-tls"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
similar = "2.7.0"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "network", "system"] }
tar = "0.4.44"
tokio = { version = "1.47.1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1.17"
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.21.0"
