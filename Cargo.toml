[package]
name = "cybion"
version = "0.6.59"
edition = "2024"
license = "MIT"
description = "Hosted multi-tenant AI execution service with paired Workers."

[[bin]]
name = "cybion"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.98"
auth-mini-axum = "=0.1.2"
async-stream = "0.3"
base64 = "0.22.1"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
bs58 = "0.5.1"
crypto_box = "0.9.1"
ed25519-dalek = "2.2.0"
chrono = { version = "0.4.41", features = ["serde"] }
directories = "6.0.0"
fractional_index = "2"
rand = "0.8.5"
futures-util = { version = "0.3.31", features = ["sink"] }
hex = "0.4"
mimalloc = { version = "0.1.52", default-features = false }
eventsource-stream = "0.2.3"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "multipart", "rustls-tls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
rust-embed = "8"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
sysinfo = { version = "0.38.4", default-features = false, features = ["disk", "network", "system"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["cors", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4", "v7", "serde"] }

[dev-dependencies]
ed25519-dalek = "2.2.0"
tempfile = "3.21.0"
