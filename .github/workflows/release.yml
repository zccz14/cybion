name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist/cybion-linux-x86_64
          cp target/release/cybion dist/cybion-linux-x86_64/
          cp README.md dist/cybion-linux-x86_64/
          tar -C dist -czf cybion-linux-x86_64.tar.gz cybion-linux-x86_64
          shasum -a 256 cybion-linux-x86_64.tar.gz > cybion-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cybion-linux-x86_64
          path: |
            *.tar.gz
            *.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
