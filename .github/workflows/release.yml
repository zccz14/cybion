name: Release

on:
  workflow_dispatch:
    inputs:
      components_only:
        description: Publish only the npm component package (no controller release/deployment)
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.components_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: python3 scripts/check-worker-release.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --dir packages/cybion-components install --frozen-lockfile
      - run: pnpm --dir packages/cybion-components run typecheck
      - run: pnpm --dir packages/cybion-components test
      - run: pnpm --dir packages/cybion-components run build
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web run build
      - run: cross build --release --locked --target x86_64-unknown-linux-gnu
      - run: |
          mkdir -p dist/cybion-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/cybion dist/cybion-linux-x86_64/
          cp README.md dist/cybion-linux-x86_64/
          cp -R third_party dist/cybion-linux-x86_64/
          tar -C dist -czf cybion-linux-x86_64.tar.gz cybion-linux-x86_64
          shasum -a 256 cybion-linux-x86_64.tar.gz > cybion-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cybion-linux-x86_64
          path: |
            *.tar.gz
            *.tar.gz.sha256
  components:
    # A manual npm-only run skips the controller build; normal releases still
    # require it to succeed. Keep this job in release.yml for the npm OIDC trust.
    if: ${{ !cancelled() && vars.NPM_COMPONENTS_PUBLISH == 'true' && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.components_only)) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/cybion-components/pnpm-lock.yaml
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11
      - run: pnpm --dir packages/cybion-components install --frozen-lockfile
      - run: pnpm --dir packages/cybion-components run typecheck
      - run: pnpm --dir packages/cybion-components test
      - run: pnpm --dir packages/cybion-components run build
      - name: Publish to npm
        # No setup-node registry-url or NODE_AUTH_TOKEN: even an empty token
        # configuration can shadow npm's automatic OIDC credential exchange.
        run: |
          unset NODE_AUTH_TOKEN NPM_TOKEN
          npm --version
          cd packages/cybion-components
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} is already published; skipping."
          else
            npm publish --provenance --access public
          fi

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: bash .github/scripts/send-deploy.sh "$EC2_INSTANCE_ID" "$GITHUB_REF_NAME"
      - name: Verify public onboarding endpoints
        run: python3 scripts/smoke-worker-onboarding.py https://cybion.ntnl.io
