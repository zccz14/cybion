name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - run: python3 scripts/check-worker-release.py
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cross build --release --locked --target x86_64-unknown-linux-gnu
      - run: |
          mkdir -p dist/cybion-linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/cybion dist/cybion-linux-x86_64/
          cp README.md dist/cybion-linux-x86_64/
          cp -R third_party dist/cybion-linux-x86_64/
          tar -C dist -czf cybion-linux-x86_64.tar.gz cybion-linux-x86_64
          shasum -a 256 cybion-linux-x86_64.tar.gz > cybion-linux-x86_64.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: cybion-linux-x86_64
          path: |
            *.tar.gz
            *.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy through AWS Systems Manager
        env:
          EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: bash .github/scripts/send-deploy.sh "$EC2_INSTANCE_ID" "$GITHUB_REF_NAME"
      - name: Verify public onboarding endpoints
        run: python3 scripts/smoke-worker-onboarding.py https://cybion.ntnl.io
