name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: mobius-linux-x86_64
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: mobius-linux-aarch64
            cross: true
          - runner: macos-14
            target: aarch64-apple-darwin
            artifact: mobius-macos-aarch64
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cross
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: cross build --release --target ${{ matrix.target }}
        if: matrix.cross
      - run: cargo build --release --target ${{ matrix.target }}
        if: ${{ !matrix.cross }}
      - run: |
          mkdir -p dist/${{ matrix.artifact }}
          cp target/${{ matrix.target }}/release/mobius dist/${{ matrix.artifact }}/
          cp README.md dist/${{ matrix.artifact }}/
          tar -C dist -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }}
          shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
