name: OIDC probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Is the OIDC request URL present?
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then echo "request-url: set"; else echo "request-url: MISSING"; fi
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then echo "request-token: set"; else echo "request-token: MISSING"; fi
      - name: Can we mint a token for npm?
        run: |
          response="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")"
          echo "$response" | head -c 120
          echo
