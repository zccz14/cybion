name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: npm --prefix web ci
      - run: npm --prefix web run check
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - run: npm --prefix web run build
      - run: python3 scripts/check-responses-parity.py
      - run: python3 scripts/test-smoke-worker-onboarding.py
      - run: bash -n .github/scripts/send-deploy.sh deploy/deploy-release.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: bash scripts/test-thread-recovery.sh
