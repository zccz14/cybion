<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      // Linkit owns the dark mode preference (see linkit-react-components);
      // apply the mirrored preference before the first paint.
      (function () {
        try {
          var choice = localStorage.getItem("linkit.theme");
          var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <link rel="icon" href="/cybion-mark.svg" type="image/svg+xml" />
    <title>Cybion</title>
    <script type="module" crossorigin src="/assets/app-B0TB9s1D.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/app-3-RJ2tQ1.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
