<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      body { width: 260px; margin: 0; padding: 14px; font: 13px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; color: #111; }
      h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
      .row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; color: #444; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #c4c4c4; }
      .dot.on { background: #16a34a; }
      button { width: 100%; margin-top: 6px; padding: 7px 10px; border-radius: 8px; border: 1px solid #d8d8d8; background: #fff; font: inherit; cursor: pointer; }
      button:hover { background: #f6f6f6; }
      kbd { padding: 1px 5px; border: 1px solid #d8d8d8; border-bottom-width: 2px; border-radius: 4px; font-size: 11px; background: #fafafa; }
      p.hint { margin: 10px 0 0; color: #777; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Cybion</h1>
    <div class="row"><span class="dot" id="dot"></span><span id="state">正在读取…</span></div>
    <button id="ask">对当前页面截图问一句</button>
    <button id="sync">从 Cybion 页面同步登录态</button>
    <button id="open">打开 Cybion</button>
    <p class="hint">快捷键 <kbd>⌘⇧K</kbd>，或右键菜单「问 Cybion」。</p>
    <script src="popup.js"></script>
  </body>
</html>
