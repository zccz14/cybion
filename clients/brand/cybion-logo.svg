<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#54545e"/>
      <stop offset="0.45" stop-color="#2a2a30"/>
      <stop offset="1" stop-color="#161616"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0.15" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#d2d2da"/>
      <stop offset="1" stop-color="#92929c"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>

  <!-- soft halo around the mark -->
  <path d="M512 337 L714 687 L310 687 Z" fill="none" stroke="#ffffff"
        stroke-width="86" stroke-linejoin="round" opacity="0.5" filter="url(#glow)"/>

  <!-- the mark -->
  <path d="M512 337 L714 687 L310 687 Z" fill="none" stroke="url(#metal)"
        stroke-width="86" stroke-linejoin="round"/>
</svg>
