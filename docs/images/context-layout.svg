<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cybion Context Layout</title><desc id="desc">Cybion README illustration</desc><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#182a72}.primary2{fill:#e8edff;stroke:#3851b5;stroke-width:2}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.accent{fill:#fff7ed;stroke:#d97706;stroke-width:2}.line{stroke:#3851b5;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;fill:none}.title{font:700 38px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.h{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.w{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}.t{font:500 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:500 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.mono{font:600 17px 'SFMono-Regular',Consolas,monospace;fill:#14235c}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#3851b5"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#d97706"/></marker></defs><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="80">Context Layout：每次 Responses API 调用的 input[]</text>
<rect class="primary" x="70" y="120" rx="22" width="1460" height="72"/><text class="w" x="650" y="167">Responses API · input[]</text>
<rect class="primary2" x="70" y="225" rx="18" width="390" height="370"/><text class="h" x="105" y="275">input[0] · 固定 developer 前缀</text><text class="t" x="110" y="335">Cybion agent policy</text><text class="t" x="110" y="385">已安装技能目录</text><text class="t" x="110" y="435">Thread role</text><text class="t" x="110" y="485">远程执行设备清单（如有）</text><text class="t" x="110" y="535">Browser Control 规则（如有）</text>
<path class="line" marker-end="url(#arrow)" d="M460 410 H525"/>
<rect class="panel" x="525" y="225" rx="18" width="560" height="370"/><text class="h" x="565" y="275">input[1..] · 编译的协议历史</text>
<rect class="muted" x="565" y="305" rx="10" width="480" height="52"/><text class="mono" x="590" y="338">checkpoint · developer 当前状态（如有）</text>
<rect class="muted" x="565" y="375" rx="10" width="480" height="52"/><text class="mono" x="590" y="408">input · 用户输入</text>
<rect class="muted" x="565" y="445" rx="10" width="480" height="52"/><text class="mono" x="590" y="478">response_output · 模型原始输出</text>
<rect class="muted" x="565" y="515" rx="10" width="480" height="52"/><text class="mono" x="590" y="548">tool_output · 工具结果</text>
<path class="line" marker-end="url(#arrow)" d="M1085 410 H1150"/>
<rect class="accent" x="1150" y="225" rx="18" width="380" height="370"/><text class="h" x="1185" y="280">可选最后一项</text><text class="t" x="1185" y="340">仅子线程刚结束</text><text class="t" x="1185" y="380">触发主线程续跑时：</text><text class="t" x="1185" y="440">临时 developer 指令</text><text class="s" x="1185" y="505">基于子线程证据</text><text class="s" x="1185" y="535">继续推进原始目标</text>
<rect class="muted" x="70" y="650" rx="16" width="1460" height="70"/><text class="t" x="110" y="694">activity：控制台进度、状态与 token 统计</text><text class="h" x="1110" y="694">不进入 input[]</text><path class="dash" marker-end="url(#arrow)" d="M1300 685 H1490"/>
<rect class="panel" x="70" y="760" rx="16" width="1460" height="86"/><text class="t" x="105" y="813">上下文溢出：独立 Checkpoint compacting 请求 → 新 checkpoint → 下次作为当前状态起点</text>
</svg>