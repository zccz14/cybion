<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">一条主线程，持续推进多个 Goal</title><desc id="desc">Cybion README illustration</desc><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#182a72}.primary2{fill:#e8edff;stroke:#3851b5;stroke-width:2}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.accent{fill:#fff7ed;stroke:#d97706;stroke-width:2}.line{stroke:#3851b5;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;fill:none}.title{font:700 38px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.h{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.w{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}.t{font:500 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:500 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.mono{font:600 17px 'SFMono-Regular',Consolas,monospace;fill:#14235c}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#3851b5"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#d97706"/></marker></defs><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="80">一条主线程，持续推进多个 Goal</text>
<rect class="panel" x="75" y="270" rx="20" width="235" height="300"/><text class="h" x="117" y="350">用户的连续输入</text><text class="s" x="115" y="385">目标、判断、补充与纠正</text><text class="s" x="115" y="505">收到进展与最终结果</text>
<path class="line" marker-end="url(#arrow)" d="M310 395 H410"/><path class="line" marker-end="url(#arrow)" d="M410 510 H310"/>
<rect class="panel" x="410" y="175" rx="24" width="560" height="500"/><rect class="primary" x="410" y="175" rx="24" width="560" height="82"/><text class="w" x="455" y="228">主线程：唯一用户可见的持续对话</text>
<text class="t" x="465" y="320">• 维护用户目标与连续主线</text><text class="t" x="465" y="395">• 汇集工具反馈与 Goal 终态证据</text><text class="t" x="465" y="470">• 编译当前上下文，决定下一有用步骤</text><text class="t" x="465" y="545">• 允许用户随时介入、改变方向或停止</text>
<rect class="primary2" x="1080" y="120" rx="18" width="400" height="145"/><text class="h" x="1120" y="175">checkpoint：当前状态</text><text class="s" x="1120" y="211">目标、约束、未完成工作与长期事实</text><path class="line" marker-end="url(#arrow)" d="M970 218 H1080"/>
<g><rect class="panel" x="1080" y="330" rx="18" width="400" height="105"/><text class="h" x="1120" y="374">Goal A / 子线程</text><text class="s" x="1120" y="408">one more step：证据 → 下一步</text><path class="line" marker-end="url(#arrow)" d="M970 380 H1080"/><path class="line" marker-end="url(#arrow)" d="M1080 420 H970"/></g>
<g><rect class="panel" x="1080" y="485" rx="18" width="400" height="105"/><text class="h" x="1120" y="529">Goal B / 子线程</text><text class="s" x="1120" y="563">one more step：证据 → 下一步</text><path class="line" marker-end="url(#arrow)" d="M970 535 H1080"/><path class="line" marker-end="url(#arrow)" d="M1080 575 H970"/></g>
<text class="s" x="990" y="405">fork</text><text class="s" x="985" y="446">达成 + 证据 / 受阻 + 原因</text><text class="s" x="985" y="560">达成 + 证据 / 受阻 + 原因</text>
<rect class="muted" x="75" y="745" rx="16" width="1405" height="80"/><text class="t" x="120" y="795">用户不管理第二套 Session；每个 Goal 的终态结果都会回到同一条主线程。</text>
</svg>