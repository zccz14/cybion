<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">文件对象与图册：内容寻址的可追溯资产</title><desc id="desc">Cybion README illustration</desc><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#182a72}.primary2{fill:#e8edff;stroke:#3851b5;stroke-width:2}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.accent{fill:#fff7ed;stroke:#d97706;stroke-width:2}.line{stroke:#3851b5;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;fill:none}.title{font:700 38px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.h{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.w{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}.t{font:500 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:500 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.mono{font:600 17px 'SFMono-Regular',Consolas,monospace;fill:#14235c}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#3851b5"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#d97706"/></marker></defs><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="80">文件对象与图册：内容寻址的可追溯资产</text>
<rect class="panel" x="70" y="195" rx="18" width="280" height="150"/><text class="h" x="110" y="250">用户上传附件</text><text class="s" x="110" y="295">文档、媒体与其他文件</text>
<rect class="panel" x="70" y="435" rx="18" width="280" height="150"/><text class="h" x="110" y="490">模型生成图片</text><text class="s" x="110" y="535">与来源 history_records 关联</text><path class="line" marker-end="url(#arrow)" d="M350 270 H470"/><path class="line" marker-end="url(#arrow)" d="M350 510 H470"/>
<rect class="panel" x="470" y="155" rx="24" width="650" height="500"/><rect class="primary" x="470" y="155" rx="24" width="650" height="82"/><text class="w" x="590" y="208">文件对象库（控制设备 SQLite）</text><rect class="primary2" x="545" y="280" rx="16" width="500" height="92"/><text class="title" x="635" y="340">SHA-256 = file_id</text><text class="t" x="535" y="435">原始 BLOB</text><text class="t" x="690" y="435">文件名</text><text class="t" x="835" y="435">MIME 类型</text><text class="t" x="535" y="510">创建时间</text><text class="t" x="690" y="510">history_entry_id</text><text class="t" x="885" y="510">图片预览</text><text class="s" x="870" y="545">480 × 480 PNG</text>
<path class="line" marker-end="url(#arrow)" d="M1120 285 H1210"/><path class="line" marker-end="url(#arrow)" d="M1120 405 H1210"/><path class="line" marker-end="url(#arrow)" d="M1120 525 H1210"/>
<rect class="panel" x="1210" y="205" rx="18" width="320" height="120"/><text class="h" x="1245" y="255">文件对象页面</text><text class="s" x="1245" y="295">上传 / 筛选 / 下载</text>
<rect class="panel" x="1210" y="365" rx="18" width="320" height="120"/><text class="h" x="1245" y="415">图册 Gallery</text><text class="s" x="1245" y="455">图片预览 + 定位到对话</text>
<rect class="panel" x="1210" y="525" rx="18" width="320" height="120"/><text class="h" x="1245" y="575">download_file</text><text class="s" x="1245" y="615">写入本机或远程设备</text>
<rect class="accent" x="70" y="735" rx="16" width="1460" height="78"/><text class="t" x="110" y="783">同一内容 → 同一 SHA-256 ID → 去重存储；图片生成预览，原始文件完整保存。</text>
</svg>