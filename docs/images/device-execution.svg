<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">控制设备与执行设备：只出站的多机协作</title><desc id="desc">Cybion README illustration</desc><style>
  .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#182a72}.primary2{fill:#e8edff;stroke:#3851b5;stroke-width:2}.muted{fill:#f1f5f9;stroke:#94a3b8;stroke-width:2}.accent{fill:#fff7ed;stroke:#d97706;stroke-width:2}.line{stroke:#3851b5;stroke-width:3;fill:none}.dash{stroke:#64748b;stroke-width:3;stroke-dasharray:9 7;fill:none}.title{font:700 38px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.h{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#14235c}.w{font:700 24px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#fff}.t{font:500 19px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#1e293b}.s{font:500 16px Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#475569}.mono{font:600 17px 'SFMono-Regular',Consolas,monospace;fill:#14235c}</style><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#3851b5"/></marker><marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12z" fill="#d97706"/></marker></defs><rect class="bg" width="1600" height="900"/>
<text class="title" x="70" y="80">控制设备与执行设备：只出站的多机协作</text>
<rect class="panel" x="70" y="300" rx="20" width="220" height="250"/><text class="h" x="110" y="370">操作者 / 浏览器</text><text class="s" x="110" y="415">通过 JWT 进入控制台</text><path class="line" marker-end="url(#arrow)" d="M290 425 H410"/><text class="h" x="335" y="405">JWT</text>
<rect class="panel" x="410" y="195" rx="22" width="470" height="470"/><rect class="primary" x="410" y="195" rx="22" width="470" height="78"/><text class="w" x="455" y="245">控制设备 A：Cybion Rust Server</text><text class="t" x="455" y="335">主线程与 Goal</text><text class="t" x="455" y="405">Responses API 上游配置</text><text class="t" x="455" y="475">SQLite 历史与文件对象</text><text class="t" x="455" y="545">Auth Mini 验证</text>
<path class="line" marker-end="url(#arrow)" d="M880 295 H1040 V190 H1150"/><path class="dash" marker-end="url(#arrow)" d="M1150 250 H1040 V340 H880"/><text class="s" x="970" y="175">Responses API 请求</text><text class="s" x="985" y="325">工具调用</text>
<rect class="primary2" x="1150" y="110" rx="18" width="360" height="135"/><text class="h" x="1190" y="165">模型上游</text><text class="s" x="1190" y="205">OpenAI-compatible Responses API</text>
<rect class="panel" x="1120" y="355" rx="22" width="410" height="310"/><rect class="primary" x="1120" y="355" rx="22" width="410" height="75"/><text class="w" x="1160" y="403">执行设备 B：工具执行环境</text><text class="t" x="1160" y="480">本地文件 / Shell</text><text class="t" x="1160" y="535">不运行模型推理</text><text class="t" x="1160" y="585">不启动 Web 控制台</text><text class="t" x="1160" y="635">不保存上游凭据</text>
<path class="line" marker-end="url(#arrow)" d="M1120 495 H880"/><text class="h" x="915" y="475">SSE：Bearer Access Token（主动出站）</text><path class="line" marker-end="url(#arrow)" d="M1120 570 H880"/><text class="h" x="910" y="615">HTTP 工具结果 / 文件分块回传</text>
<rect class="accent" x="240" y="735" rx="16" width="1120" height="78"/><text class="t" x="285" y="783">一次性配对 URL → 15 分钟、单次使用 → Token 仅保存 SHA-256 哈希</text><text class="s" x="240" y="865">执行设备无需公网 IP、端口映射或 Auth Mini 登录。</text>
</svg>